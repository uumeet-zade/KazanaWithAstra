<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
    <rect width="800" height="1200" fill="#8c263e"/>
    
    <polygon points="0,0 800,0 800,550 0,850" fill="#220735"/>
    
    <rect x="40" y="40" width="720" height="1120" fill="none" stroke="#ffffff" stroke-width="8"/>
    
    <text x="80" y="160" font-family="'Outfit', sans-serif" font-weight="900" font-size="80" fill="#ff2459" letter-spacing="1">POWER TO</text>
    <text x="80" y="250" font-family="'Outfit', sans-serif" font-weight="900" font-size="80" fill="#ffffff" letter-spacing="1">THE FLOOR</text>
    
    <text x="80" y="360" font-family="'Inter', sans-serif" font-weight="600" font-size="32" fill="#e0e0e0">Universal union bargaining floors.</text>
    <text x="80" y="420" font-family="'Inter', sans-serif" font-weight="600" font-size="32" fill="#e0e0e0">Protect workers against monopolies.</text>
    
    <path d="M 80 500 L 720 500" stroke="#ff2459" stroke-width="6"/>
    
    <text x="720" y="660" font-family="'Outfit', sans-serif" font-weight="900" font-size="60" fill="#ff2459" text-anchor="end" letter-spacing="1">THE LAND ANSWERS</text>
    <text x="720" y="740" font-family="'Outfit', sans-serif" font-weight="900" font-size="60" fill="#ffffff" text-anchor="end" letter-spacing="1">TO KAZANA</text>
    
    <text x="720" y="860" font-family="'Inter', sans-serif" font-weight="600" font-size="32" fill="#e0e0e0" text-anchor="end">Locally set environmental standards.</text>
    <text x="720" y="920" font-family="'Inter', sans-serif" font-weight="600" font-size="32" fill="#e0e0e0" text-anchor="end">Regional self-determination.</text>
    
    <rect x="40" y="1000" width="720" height="160" fill="#ff2459"/>
    <text x="400" y="1070" font-family="'Outfit', sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle">GOVERNOR ASTRA DAY</text>
    <text x="400" y="1120" font-family="'Inter', sans-serif" font-weight="600" font-size="28" fill="#ffffff" text-anchor="middle">KAZANA'S LEFT | REJUVENATION PARTY</text>
    
    <!-- Border (Drawn last so it sits on top of everything) -->
    <rect x="40" y="40" width="720" height="1120" fill="none" stroke="#ffffff" stroke-width="8"/>
