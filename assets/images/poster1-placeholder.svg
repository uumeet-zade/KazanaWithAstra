<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
    <!-- Base background (Deep Purple) -->
    <rect width="800" height="1200" fill="#220735"/>
    
    <!-- Diagonal slash (Vibrant Pink) going top-left to bottom-right, mirroring poster 2 -->
    <polygon points="0,0 800,0 800,850 0,550" fill="#ff2459"/>
    
    <!-- Subtle geometric background motif to keep it distinct (the districts/radar) -->
    <circle cx="800" cy="200" r="400" fill="none" stroke="#220735" stroke-width="30" opacity="0.2"/>
    <circle cx="800" cy="200" r="300" fill="none" stroke="#220735" stroke-width="15" opacity="0.2"/>
    <circle cx="800" cy="200" r="200" fill="none" stroke="#220735" stroke-width="8" opacity="0.2"/>
    

    
    <!-- Top Text (Left aligned, matching layout of Poster 2) -->
    <text x="80" y="160" font-family="'Outfit', sans-serif" font-weight="900" font-size="80" fill="#ffffff" letter-spacing="1">SOVEREIGN</text>
    <text x="80" y="250" font-family="'Outfit', sans-serif" font-weight="900" font-size="80" fill="#220735" letter-spacing="1">DISTRICTS</text>
    
    <text x="80" y="360" font-family="'Inter', sans-serif" font-weight="600" font-size="32" fill="#220735">Devolve budget and procurement</text>
    <text x="80" y="420" font-family="'Inter', sans-serif" font-weight="600" font-size="32" fill="#220735">directly to district boards.</text>
    
    <!-- Center divider matching poster 2 -->
    <path d="M 80 500 L 720 500" stroke="#220735" stroke-width="6"/>
    
    <!-- Bottom Text (Right aligned, matching layout of Poster 2) -->
    <text x="720" y="620" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="end" letter-spacing="1">NOBODY'S COMING</text>
    <text x="720" y="690" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="end" letter-spacing="1">TO SAVE YOU</text>
    <text x="720" y="760" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="end" letter-spacing="1">BUT EACH OTHER.</text>
    
    <text x="720" y="860" font-family="'Inter', sans-serif" font-weight="600" font-size="32" fill="#e0e0e0" text-anchor="end">Kazana's infrastructure</text>
    <text x="720" y="920" font-family="'Inter', sans-serif" font-weight="600" font-size="32" fill="#e0e0e0" text-anchor="end">belongs to Kazana.</text>
    
    <!-- Footer block matching poster 2 (Solid Burgundy to contrast poster 2's pink) -->
    <rect x="40" y="1000" width="720" height="160" fill="#8c263e"/>
    <text x="400" y="1070" font-family="'Outfit', sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle">GOVERNOR ASTRA DAY</text>
    <text x="400" y="1120" font-family="'Inter', sans-serif" font-weight="600" font-size="28" fill="#ffffff" text-anchor="middle">KAZANA'S LEFT | 2062 ELECTIONS</text>
    
    <!-- Inner Border (Drawn last so it sits on top of everything) -->
    <rect x="40" y="40" width="720" height="1120" fill="none" stroke="#ffffff" stroke-width="8"/>
</svg>
